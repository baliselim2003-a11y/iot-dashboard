<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
<title>TP IoT — Dashboard LED</title>
</head>
<body>
<div class="wrap">
<h1>TP IoT — Dashboard LED</h1>
<main class="card" id="card"></main>

<div id="sens">
<section class="sec" style="margin-top:18px">
  <h2>Température &amp; humidité</h2>
  <div class="seg" role="group" aria-label="Affichage">
    <button data-m="t" aria-pressed="false">Température</button>
    <button data-m="h" aria-pressed="false">Humidité</button>
    <button data-m="b" aria-pressed="true">Les deux</button>
  </div>
  <div class="gauges">
    <div class="g" id="gaugeH"><svg viewBox="0 0 200 175" role="img" aria-label="Humidité">
      <circle cx="100" cy="95" r="72" pathLength="100" stroke="#262b36" stroke-width="18" stroke-dasharray="75 100" transform="rotate(135 100 95)"/>
      <circle id="gh" class="gv" cx="100" cy="95" r="72" pathLength="100" stroke="#38bdf8" stroke-width="18" stroke-dasharray="0 100" transform="rotate(135 100 95)"/>
      <text id="th" x="100" y="108" text-anchor="middle" font-size="26" fill="#38bdf8" font-weight="500">--</text>
    </svg><div class="lab">Humidité</div></div>
    <div class="g" id="gaugeT"><svg viewBox="0 0 200 175" role="img" aria-label="Température">
      <circle cx="100" cy="95" r="72" pathLength="100" stroke="#262b36" stroke-width="18" stroke-dasharray="75 100" transform="rotate(135 100 95)"/>
      <circle id="gt" class="gv" cx="100" cy="95" r="72" pathLength="100" stroke="#f59e0b" stroke-width="18" stroke-dasharray="0 100" transform="rotate(135 100 95)"/>
      <text id="tt" x="100" y="108" text-anchor="middle" font-size="26" fill="#f59e0b" font-weight="500">--</text>
    </svg><div class="lab">Température</div></div>
  </div>
</section>

<div class="charts">
  <section class="sec" id="secH"><h2>Humidité</h2><div class="plot" id="ph"></div></section>
  <section class="sec" id="secT"><h2>Température</h2><div class="plot" id="pt"></div></section>
</div>
</div>
</div>
<script src="index.js"></script>
</body>
</html>
