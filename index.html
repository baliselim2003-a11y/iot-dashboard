<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TP IoT — Dashboard LED</title>
<style>
:root{--bg:#f3f4f8;--card:#fff;--ink:#1b2230;--off:#c9ced8;--on:#22c55e;--no:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#12151c;--card:#1d222d;--ink:#eef1f6;--off:#3a4150}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;padding:20px 40px}
.wrap{max-width:750px;margin:0 auto}
h1{text-align:center;font-size:24px;font-weight:700;margin:0 0 22px}
.card{background:var(--card);border-radius:20px;padding:20px 16px 24px;box-shadow:0 8px 24px rgba(20,30,50,.08);display:flex;flex-wrap:wrap;justify-content:center;gap:30px 90px}
.led{display:flex;flex-direction:column;align-items:center}
.bulb{width:75px;height:112px;border-radius:24px 24px 40px 40px;background:var(--off);transition:background .25s,box-shadow .25s;margin:4px 0 10px}
.led.on .bulb{background:var(--on);box-shadow:0 0 26px 8px rgba(34,197,94,.4)}
.led:not(.on) .bulb{background:var(--no);box-shadow:0 0 26px 8px rgba(239,68,68,.4)}
.name{font-weight:700;font-size:18px;margin-bottom:8px}
.btns{display:flex;gap:6px}
button{border:0;border-radius:8px;padding:9px 16px;font:inherit;font-size:16px;color:#fff;cursor:pointer;transition:transform .1s,filter .2s}
button:hover{filter:brightness(1.07)}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.b-on{background:var(--on)}.b-off{background:var(--no)}
.sec{background:var(--card);border-radius:20px;padding:16px 18px 18px;box-shadow:0 8px 24px rgba(20,30,50,.08);margin-top:18px}
.sec h2{font-size:15px;font-weight:700;margin:0 0 10px}
.gauges{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 50px}
.g{width:210px;text-align:center}
.g svg{display:block;width:100%;height:auto}
.g circle{fill:none}
.g .gv{transition:stroke-dasharray .8s}
.g text{font-family:inherit}
.g .lab{font-size:15px;font-weight:600;margin-top:-4px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.charts .sec{margin-top:0}
.plot{display:grid;grid-template-columns:42px 1fr;grid-template-rows:130px auto;font-size:11px;color:#6b7482}
.yl{display:flex;flex-direction:column;justify-content:space-between;text-align:right;padding-right:6px;margin:-6px 0}
.plot svg{width:100%;height:130px;display:block}
.plot .gl{stroke:rgba(128,138,155,.25);stroke-width:1;vector-effect:non-scaling-stroke}
.plot path{vector-effect:non-scaling-stroke}
.xl{grid-column:2;display:flex;justify-content:space-between;margin-top:6px}
#sens{margin-top:18px}
.seg{display:flex;gap:4px;background:rgba(128,138,155,.14);border-radius:12px;padding:4px;margin:0 0 14px}
.seg button{flex:1;background:none;color:inherit;opacity:.7;font-size:14px;font-weight:600;padding:8px 10px;border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--card);opacity:1;box-shadow:0 1px 4px rgba(20,30,50,.18)}
.m-t #gaugeH,.m-t #secH,.m-h #gaugeT,.m-h #secT{display:none}
.m-t .charts,.m-h .charts{grid-template-columns:1fr}
@media (max-width:560px){.charts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bulb,button{transition:none}}
@media (max-width:560px){body{padding:16px}.card{gap:26px 40px}}
</style>
</head>
<body>
<div class="wrap">
<h1>TP IoT — Dashboard LED</h1>
<main class="card" id="card"></main>

<div id="sens">
<section class="sec" style="margin-top:18px">
  <h2>Température &amp; humidité</h2>
  <div class="seg" role="group" aria-label="Affichage">
    <button data-m="t" aria-pressed="false">Température</button>
    <button data-m="h" aria-pressed="false">Humidité</button>
    <button data-m="b" aria-pressed="true">Les deux</button>
  </div>
  <div class="gauges">
    <div class="g" id="gaugeH"><svg viewBox="0 0 200 175" role="img" aria-label="Humidité">
      <circle cx="100" cy="95" r="72" pathLength="100" stroke="#e9ecf1" stroke-width="18" stroke-dasharray="75 100" transform="rotate(135 100 95)"/>
      <circle id="gh" class="gv" cx="100" cy="95" r="72" pathLength="100" stroke="#4caf50" stroke-width="18" stroke-dasharray="0 100" transform="rotate(135 100 95)"/>
      <text id="th" x="100" y="108" text-anchor="middle" font-size="26" fill="#4caf50" font-weight="500">--</text>
    </svg><div class="lab">Humidité</div></div>
    <div class="g" id="gaugeT"><svg viewBox="0 0 200 175" role="img" aria-label="Température">
      <circle cx="100" cy="95" r="72" pathLength="100" stroke="#e9ecf1" stroke-width="18" stroke-dasharray="75 100" transform="rotate(135 100 95)"/>
      <circle id="gt" class="gv" cx="100" cy="95" r="72" pathLength="100" stroke="#4caf50" stroke-width="18" stroke-dasharray="0 100" transform="rotate(135 100 95)"/>
      <g fill="none" stroke-width="4" transform="rotate(135 100 95)">
        <circle cx="100" cy="95" r="86" pathLength="100" stroke="#5794f2" stroke-dasharray="18.75 100"/>
        <circle cx="100" cy="95" r="86" pathLength="100" stroke="#73bf69" stroke-dasharray="28.1 100" stroke-dashoffset="-18.75"/>
        <circle cx="100" cy="95" r="86" pathLength="100" stroke="#fade2a" stroke-dasharray="9.4 100" stroke-dashoffset="-46.85"/>
        <circle cx="100" cy="95" r="86" pathLength="100" stroke="#f2495c" stroke-dasharray="18.75 100" stroke-dashoffset="-56.25"/>
      </g>
      <text id="tt" x="100" y="108" text-anchor="middle" font-size="26" fill="#4caf50" font-weight="500">--</text>
    </svg><div class="lab">Température</div></div>
  </div>
</section>

<div class="charts">
  <section class="sec" id="secH"><h2>Humidité</h2><div class="plot" id="ph"></div></section>
  <section class="sec" id="secT"><h2>Température</h2><div class="plot" id="pt"></div></section>
</div>
</div>
</div>

<script>
// Pour ajouter une LED : ajoutez simplement un nom dans cette liste.
var LEDS=['LED1','LED2'];

// Envoi de la commande à votre appareil (à adapter : fetch, MQTT, WebSocket…)
function sendCommand(name,on){
  // exemple : fetch('http://ADRESSE_ESP/'+name.toLowerCase()+'/'+(on?'on':'off'));
}

var card=document.getElementById('card');
LEDS.forEach(function(name){
  var el=document.createElement('div');
  el.className='led';
  el.innerHTML='<div class="bulb"></div><div class="name"></div>'+
    '<div class="btns"><button class="b-on">ON</button><button class="b-off">OFF</button></div>';
  var label=el.querySelector('.name');
  function set(on,send){
    el.classList.toggle('on',on);
    label.textContent=name+(on?' ON':' OFF');
    if(send)sendCommand(name,on);
  }
  el.querySelector('.b-on').onclick=function(){set(true,true)};
  el.querySelector('.b-off').onclick=function(){set(false,true)};
  set(name==='LED1',false);
  card.appendChild(el);
});

/* ===== Température & humidité ===== */
// Remplacez readSensors() par votre vraie lecture (fetch, MQTT…) : {t:°C, h:%}
function readSensors(prev){
  return {t:Math.min(Math.max(prev.t+(Math.random()-.5)*.3,15),32),
          h:Math.min(Math.max(prev.h+(Math.random()-.5)*1.2,30),70)};
}
var M=72, TT=[], HH=[], tx=23, hx=50;
for(var i=0;i<M;i++){tx+=(Math.random()-.5)*.25;hx+=(Math.random()-.5)*.8-(i>60?.35:0);TT.push(tx);HH.push(hx)}
function fmt(v){return v.toFixed(1).replace('.',',')}
function plot(id,a,min,max,ticks,color){
  var el=document.getElementById(id),W=300,H=130;
  var pts=a.map(function(v,i){return(i?'L':'M')+(i/(a.length-1)*W).toFixed(1)+' '+(H-(v-min)/(max-min)*H).toFixed(1)}).join('');
  var grid=ticks.map(function(t){var y=H-(t-min)/(max-min)*H;return'<line class="gl" x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'"/>'}).join('');
  var yl=ticks.slice().reverse().map(function(t){return'<span>'+t+'</span>'}).join('');
  var now=new Date(),xs='';
  for(var k=5;k>=0;k--){var d=new Date(now-k*3600000);xs+='<span>'+('0'+d.getHours()).slice(-2)+':00</span>'}
  el.innerHTML='<div class="yl">'+yl+'</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+grid+
    '<path d="'+pts+'L'+W+' '+H+'L0 '+H+'Z" fill="'+color+'" opacity=".12"/>'+
    '<path d="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round"/></svg>'+
    '<div class="xl">'+xs+'</div>';
}
function renderSensors(){
  var t=TT[M-1],h=HH[M-1];
  document.getElementById('gh').setAttribute('stroke-dasharray',(Math.min(Math.max(h/100,0),1)*75)+' 100');
  document.getElementById('gt').setAttribute('stroke-dasharray',(Math.min(Math.max(t/40,0),1)*75)+' 100');
  document.getElementById('th').textContent=fmt(h)+' %H';
  document.getElementById('tt').textContent=fmt(t)+' °C';
  plot('ph',HH,0,100,[0,20,40,60,80,100],'#4caf50');
  plot('pt',TT,0,40,[0,10,20,30,40],'#4caf50');
}
document.querySelectorAll('.seg button').forEach(function(b){
  b.onclick=function(){
    var box=document.getElementById('sens');
    box.classList.remove('m-t','m-h');
    if(b.dataset.m!=='b')box.classList.add('m-'+b.dataset.m);
    document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
  };
});
renderSensors();
setInterval(function(){
  var r=readSensors({t:TT[M-1],h:HH[M-1]});
  TT.push(r.t);HH.push(r.h);TT.shift();HH.shift();renderSensors();
},8000);
</script>
</body>
</html>
